<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lobotomy Corp Novel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Hidden iframe for YouTube audio -->
    <div id="audio-container" style="display: none;"></div>

    <div id="game-container">
        <!-- Start Screen -->
        <div id="start-screen">
            <div id="menu-container">
                <div class="menu-decor top-decor"></div>
                <button id="start-btn" class="menu-btn">LOG IN</button>
                <div class="menu-btn error-btn" aria-disabled="true"><span>ERROR_0xFEA</span> <br><small>DATA CORRUPTED</small></div>
                <div class="menu-btn error-btn" aria-disabled="true"><span>[REDACTED]</span></div>
                <div class="menu-btn error-btn" aria-disabled="true"><span>SYS_FAIL</span> <br><small>ACCESS DENIED</small></div>
                <div class="menu-decor bottom-decor"></div>
            </div>

            <div id="menu-background-elements">
                <div class="vertical-line"></div>
                <div class="vertical-line right"></div>
            </div>
        </div>

        <!-- Game Interface -->
        <div id="novel-interface" style="display: none;">
            <!-- Character Area -->
            <div id="character-area">
                <img id="character-sprite" src="assets/kaardie.png" alt="Character">
                <div id="confetti-container"></div>
            </div>

            <!-- Dialogue Options -->
            <div id="options-container" style="display: none;"></div>

            <!-- Dialogue Box -->
            <div id="dialogue-container">
                <div id="name-tag">Character</div>
                <div id="dialogue-box">
                    <p id="dialogue-text"></p>
                    <span id="next-indicator">>>SKIP</span>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
